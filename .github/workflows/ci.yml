name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nusurnet
          POSTGRES_PASSWORD: nusurnet_dev_password
          POSTGRES_DB: nusurnet
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://nusurnet:nusurnet_dev_password@localhost:5432/nusurnet?schema=public
      DIRECT_URL: postgresql://nusurnet:nusurnet_dev_password@localhost:5432/nusurnet?schema=public
      AUTH_SECRET: ci-secret-only-for-ci-not-for-prod-use-32chars-min
      AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run Prisma migrations
        run: npm run db:push

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
