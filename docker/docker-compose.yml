name: nusurnet

services:
  postgres:
    image: postgres:16-alpine
    container_name: nusurnet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nusurnet
      POSTGRES_PASSWORD: nusurnet_dev_password
      POSTGRES_DB: nusurnet
      # Force UTF-8 collation, important for multilingual content (FR/IT/AR)
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nusurnet -d nusurnet']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nusurnet_network

  redis:
    image: redis:7-alpine
    container_name: nusurnet_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nusurnet_network

  # Optional: Mailhog for local email testing (uncomment when you start sending emails)
  # mailhog:
  #   image: mailhog/mailhog:latest
  #   container_name: nusurnet_mailhog
  #   restart: unless-stopped
  #   ports:
  #     - '1025:1025'  # SMTP
  #     - '8025:8025'  # Web UI
  #   networks:
  #     - nusurnet_network

volumes:
  postgres_data:
    name: nusurnet_postgres_data
  redis_data:
    name: nusurnet_redis_data

networks:
  nusurnet_network:
    name: nusurnet_network
    driver: bridge
